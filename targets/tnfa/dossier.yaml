    vhh2:
      pdb: "5M2J"
      kd_pm: 130
      ic50_nm: 0.748
      epitope: "Central groove, CDR1/CDR2 dominated (CDR3 only 131 A2)"
    vhh3:
      pdb: "5M2M"
      kd_pm: 1500
