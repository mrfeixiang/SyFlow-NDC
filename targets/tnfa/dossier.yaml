      pdb: "8Z8M"
      kd_pm: 20.2  # trivalent avidity
      status: "Approved Japan 2022 (Nanozora)"
      format: "Trivalent: 2x anti-TNF VHH + 1x anti-HSA VHH"
      note: "95.65% sequence identity to VHH#2"
    cross_species_warning: |
      CRITICAL: All published anti-TNF VHHs (ozoralizumab, TNFI-Nbs NN-223/224)
      are HUMAN-SPECIFIC and do NOT cross-react with mouse TNF-α. This confirms
      significant binding-interface divergence between species. Competition objective
      2 (mouse cross-reactivity) requires deliberate design for conserved epitopes.

  key_biology: |
    TNF-α is a pleiotropic pro-inflammatory cytokine. Exists as a homotrimer
    with three receptor-binding sites at protomer-protomer interfaces.
    Therapeutic antibodies adalimumab and infliximab target the receptor-binding
    groove between protomers for autoimmune diseases (RA, Crohn's, psoriasis).

    Ozoralizumab (Nanozora) is the first approved anti-TNF nanobody drug (Japan 2022),
    achieving IC50 = 12 pM as trivalent construct, outperforming adalimumab (127 pM).

  binding_epitope: |
    Receptor-binding sites located at GROOVES between adjacent protomers.
    TNF residues contacted by VHH (<3.8 A, from PDB 5M2I/5M2J):
    Monomer A: 20-25, 65-67, 70, 72-74, 77, 79, 81, 83, 88-92, 97, 107, 135-141
    Monomer B: 115, 145-147
    E-F loop (res ~140-146) is critical for receptor engagement.

    For cross-species reactivity: MUST target residues conserved between human
    and mouse TNF-α. Published VHHs are human-specific, so cross-reactivity
    requires backbone-mediated contacts (N/S/T enrichment) at conserved positions.

  ph_switch_precedent: |
    W1-Humira (Hong et al. 2021, DOI:10.3390/biom11020334): pH-engineered
    adalimumab with CDR His substitutions. Confirmed pH-dependent TNF binding
    in vitro. Validates our Group C/D His-switch strategy directly for TNF-α.

  therapeutic_reference:
    adalimumab: "Humira — anti-TNF-α mAb, binds at protomer interface"
    infliximab: "Remicade — chimeric anti-TNF-α mAb"
    certolizumab: "Cimzia — PEGylated Fab"
    etanercept: "Enbrel — TNFR2-Fc fusion (decoy receptor)"

design_strategy:
  framework:
    scaffold: "cAbBCII10-derived synthetic VHH"
    pdb_reference: "3DWT"
    framework_regions:
      FR1: "EVQLVESGGGLVQAGGSLRLSCAAS"  # 25 aa
      FR2: "WFRQAPGKEREGVS"              # 14 aa
      FR3: "RFTISRDNAKNTVYLQMNSLKPEDTAVYYC"  # 30 aa
      FR4: "WGQGTQVTVSS"                 # 11 aa

  four_design_groups:
    group_A:
      name: "Strong affinity binders (designs 01-05)"
      count: 5
      strategy: |
        Maximum binding affinity to human TNF-α. Aromatic-rich CDR3 (W/Y/F)
        targeting the protomer interface groove. No pH engineering.
        Serves as affinity baseline controls.
      ph_his_count: 0

    group_B:
      name: "Cross-species optimized (designs 06-10)"
      count: 5
      strategy: |
        CDRs enriched in Asn(N), Ser(S), Thr(T) for backbone H-bonds to
        conserved residues between human and mouse TNF-α. Avoids contacts
        with species-variable surface positions. No pH engineering.
      ph_his_count: 0

    group_C:
      name: "Mild pH switch (designs 11-15)"
      count: 5
      strategy: |
        1-2 strategic His substitutions replacing W, R, or Y at CDR interface
        positions. At pH 7.4 His is uncharged (H-bonds + aromatic stacking work).
        At pH 6.0 His is protonated (+1 charge → electrostatic repulsion → no binding).
        Based on Wei et al. 2022 (DOI:10.1002/prot.26340): W→His, R→His, Y→His
        at CDR positions most effective for pH-dependent binding.
      ph_his_count: "1-2 per design"

    group_D:
      name: "Strong pH switch + cross-species (designs 16-20)"
      count: 5
      strategy: |
        3-4 His substitutions across CDR1/2/3 for maximum pH selectivity
        PLUS cross-species epitope targeting via N/S/T enrichment.
        Highest-scoring potential: addresses all three competition objectives.
        Trade-off: more His → stronger pH switch but lower absolute affinity.
      ph_his_count: "3-4 per design"

  pH_switch_mechanism: |
    HISTIDINE pH-SWITCH PRINCIPLE (Wei et al. 2022, Proteins 90:1538):
    - pKa of His imidazole sidechain ≈ 6.0
    - At pH 7.4 (physiological): His is uncharged → forms H-bonds, π-stacking
    - At pH 6.0 (tumor/endosome): His protonated → +1 charge → electrostatic
      clash with positively charged residues on antigen → binding disrupted
    - Best positions: W→His, R→His, Y→His substitutions in CDR
    - SIpHAB tool available: https://mm.nrc-cnrc.gc.ca/software/siphab/runner/
    (Wei & Sulea 2024, mAbs 16:2404064)

