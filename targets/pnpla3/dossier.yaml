# PNPLA3 Target Dossier — SyFlow NDC Go/No-Go Assessment
# NOTE: PNPLA3 is primarily intracellular. This dossier evaluates whether
# any NDC-compatible approach exists, or if small molecule remains optimal.

dossier_id: SYFLOW-PNPLA3-001
modality: small_molecule  # Default — NDC viability to be assessed
stage: target_identification
version: "1.0"

target_profile:
  gene_symbol: PNPLA3
  uniprot_id: Q9NST1
  protein_name: "Patatin-like phospholipase domain-containing protein 3"
  indication: "NASH / MAFLD (Metabolic dysfunction-associated fatty liver disease)"
  patient_subset: "PNPLA3 I148M homozygous carriers with hepatic steatosis"
  is_surface_protein: false  # Critical: PNPLA3 is a lipid droplet-associated protein
  membrane_topology: "Lipid droplet membrane, not plasma membrane"
  known_mutations:
    - "I148M (rs738409) — major NASH risk variant, loss of lipase activity"
    - "E434K — protective variant"
  key_biology: |
    PNPLA3 localizes to lipid droplets in hepatocytes and hepatic stellate cells.
    The I148M variant accumulates on lipid droplets due to resistance to ubiquitin-
    mediated degradation, promoting steatosis. NOT accessible to extracellular
    biologics without a delivery strategy.

  # NDC-specific challenges
  ndc_viability_concerns:
    - "No extracellular domain — cannot be targeted by VHH directly"
    - "Liver-specific expression may allow hepatocyte-targeted NDC delivering PNPLA3 degrader"
    - "Consider ASGPR-targeted delivery for liver-specific payload release"
    - "GalNAc-siRNA (e.g., ARO-PNPLA3) already in clinical development"

