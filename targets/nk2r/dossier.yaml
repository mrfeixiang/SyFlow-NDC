next_steps:
  - step: "Submit top 3 sequences to PDC2026 before 2026-11-11"
    priority: critical
    recommended_submission: ["SyF-NK2R-A1", "SyF-NK2R-A3", "SyF-NK2R-A5"]
    rationale: |
      A1 = highest agonist probability (orthosteric mechanism, Met mimic)
      A3 = best iPTM potential (extensive H-bond network, structured CDR3)
      A5 = best deltaSASA potential (largest interface, broad epitope)

  - step: "Run AlphaFold3 prediction (NK2R + VHH + Galpha) for all 5 designs"
    priority: high
    tool: "AlphaFold3 server or local Boltz-2"
    metrics_to_extract: ["iPTM", "chain_ipTM", "pAE", "pLDDT", "deltaSASA"]

  - step: "Iterate CDR sequences based on AF3 feedback"
    priority: high
    method: |
      1. Run AF3 on all 5 candidates
      2. Identify which designs achieve iPTM > 0.8
      3. For designs below threshold: modify CDR3 residues at low-pLDDT positions
      4. Maximize deltaSASA by extending interface contacts
      5. Re-predict and iterate until 3 candidates meet criteria

  - step: "Cross-validate with Boltz-2 and BindCraft"
    priority: medium
    rationale: "Competition uses AF3; cross-validation improves confidence"

  - step: "Run RFAntibody diffusion-based VHH design as orthogonal approach"
    priority: medium
    tool: "../rfantibody/ — RFdiffusion + ProteinMPNN + RoseTTAFold2"
    input_pdb: "7XWO (NK2R active state with NKA and Gq)"
    rationale: "Generate additional candidates via backbone diffusion against actual cryo-EM structure"

  - step: "Run NanoFlow pipeline for scoring and QC"
    priority: medium
    tool: "../nanobody-pipeline/pipeline.py"
    rationale: "4-block pipeline (Design→CoFold→Score→QC) for systematic VHH evaluation"

