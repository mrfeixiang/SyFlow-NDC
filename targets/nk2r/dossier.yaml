target_profile:
  gene_symbol: TACR2
  common_name: NK2R
  uniprot_id: P21452
  protein_name: "Neurokinin 2 receptor (Substance-K receptor)"
  organism: "Homo sapiens"
  protein_class: "Class A GPCR, Tachykinin receptor family"
  indication: "Obesity, Type 2 Diabetes, Metabolic Disease (NASH/MAFLD)"
  mechanism_of_interest: "Agonism — dual action: central appetite suppression + peripheral energy expenditure"

  key_biology: |
    NK2R is a class A GPCR activated by the endogenous tachykinin neuropeptide
    Neurokinin A (NKA, sequence: HKTDSFVGLM). NK2R activation drives:
    1. Central appetite suppression (bypasses canonical leptin signaling)
    2. Peripheral energy expenditure increase
    3. Acute insulin sensitization

    Sass et al. (Nature 2024, DOI:10.1038/s41586-024-08207-0) demonstrated:
    - Genetic links between NK2R variants and obesity/glucose control
    - Long-acting NK2R agonists cause weight loss in mice and diabetic macaques
    - Reduction of blood glucose, triglycerides, cholesterol in obese primates

    Key challenge: NKA is short-lived and lacks receptor specificity (cross-reacts
    with NK1R and NK3R). A VHH agonist offers selectivity + long half-life.

