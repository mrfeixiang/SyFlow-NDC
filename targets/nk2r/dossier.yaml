vhh_design:
  framework:
    scaffold: "cAbBCII10-derived synthetic VHH scaffold"
    pdb_reference: "3DWT"
    rationale: |
      cAbBCII10 is the gold-standard synthetic VHH framework with:
      - High thermostability (Tm > 70C)
      - Excellent E. coli expression
      - Well-characterized CDR grafting tolerance
      - Validated in multiple successful nanobody design campaigns
    framework_regions:
      FR1: "EVQLVESGGGLVQAGGSLRLSCAAS"  # 25 aa
      FR2: "WFRQAPGKEREGVS"              # 14 aa
      FR3: "RFTISRDNAKNTVYLQMNSLKPEDTAVYYC"  # 30 aa
      FR4: "WGQGTQVTVSS"                 # 11 aa
    hallmark_residues:
      pos37: "F (Phe) — VHH hallmark, replaces VH Val"
      pos44: "E (Glu) — VHH hallmark, salt bridge with pos45"
      pos45: "R (Arg) — VHH hallmark"

  design_strategy: |
    AGONIST VHH DESIGN FOR CLASS A GPCR:

    Key challenge: Unlike class B GPCRs with large ECDs, class A GPCRs like NK2R
    have minimal extracellular surface. The VHH must engage the limited extracellular
    loops (ECL1, ECL2, ECL3) and N-terminus while inducing the conformational change
    needed for G-protein coupling (outward TM6 movement).

    Strategy derived from:
    1. Sachdev & Cheloha (2026) Br J Pharmacol — bitopic GPCR VHH conjugates
    2. Muratspahi et al. (2025) — de novo nanobodies for GPCRs via RFdiffusion
    3. Nabla Bio — agonistic VHH against CXCR7 (proof of concept)
    4. Petersen et al. (2024) JBC — NK1R/NK2R activation mechanism details

    DESIGN PRINCIPLES FOR iPTM > 0.8:
    - Maximize structured CDR3 (helical or beta-hairpin elements) — AF3 rewards
      ordered interfaces over floppy loops
    - Include aromatic residues (W, Y, F) at interface — high confidence contacts
    - Balance polar (H-bond) and hydrophobic contacts — improves PAE
    - CDR3 length 16-21 residues — sufficient for GPCR extracellular engagement

    DESIGN PRINCIPLES FOR HIGH deltaSASA:
    - Maximize CDR3 length → larger buried interface
    - Broad contact footprint across multiple ECLs
    - Flat/convex binding surface topology
    - Include both hydrophobic core and polar rim contacts

    AGONIST MECHANISM PRINCIPLES:
    - CDR3 must reach into or near the orthosteric pocket to mimic NKA engagement
    - Alternatively, lock ECL2/ECL3 to stabilize TM6 outward active conformation
    - Include Met/Leu residues in CDR3 tip to mimic NKA C-terminal -GLM

  candidates:
    - id: SyF-NK2R-A1
      name: "Orthosteric-Pocket Agonist"
      cdr1: GFTFSSYAMS
      cdr2: AINWSGGSTY
      cdr3: AKEPYWDSGTMFYQKIDV
      total_length: 118
      strategy: |
        Long CDR3 (18 residues) with Met-containing tip to engage deep orthosteric
        pocket, mimicking NKA C-terminal -GLM engagement with toggle switch.
        CDR1 aromatic (Y) anchors on ECL2. CDR2 W provides CH-pi interaction with
        ECL1. Expected to directly activate via orthosteric mechanism.
      predicted_epitope: "ECL2 + orthosteric pocket entrance"
      agonist_rationale: "Direct orthosteric engagement; Met in CDR3 mimics NKA-Met(10)"

    - id: SyF-NK2R-A2
      name: "ECL2-ECL3 Allosteric Bridge"
      cdr1: GRTFSNYAMG
      cdr2: TISSGGSITY
      cdr3: AADRGYWDELDSFYEV
      total_length: 116
      strategy: |
        Medium CDR3 (16 residues) bridging ECL2 and ECL3 with aromatic wedge
        residues (Y, W) that lock TM5-TM6 in the outward active conformation.
        Acidic residues (D, E) create complementary charge interactions with
        basic residues on ECL3. High shape complementarity for strong iPTM.
      predicted_epitope: "ECL2-ECL3 bridge region"
      agonist_rationale: "Allosteric activation; wedges TM6 outward via ECL2-ECL3 constraint"

    - id: SyF-NK2R-A3
      name: "N-terminus Clamp + ECL2"
      cdr1: GFTLDYYAIG
      cdr2: INWSGGSTDY
      cdr3: AAKPFWHRSTDGTYYYDSEV
      total_length: 120
      strategy: |
        Extended CDR3 (20 residues) creating a clamp between receptor N-terminus
        and ECL2. Triple tyrosine (YYY) motif forms extensive H-bond network.
        W and F provide hydrophobic core contacts. R and D create salt bridges.
        Large contact footprint maximizes deltaSASA for high ranking.
      predicted_epitope: "N-terminus + ECL2 clamp"
      agonist_rationale: "N-terminal engagement may trigger conformational cascade; ECL2 constraint activates"

    - id: SyF-NK2R-A4
      name: "Toggle-Switch Activator"
      cdr1: GSIFSINAMI
      cdr2: AITWSGESTY
      cdr3: AKDFYWQSMTGRSFDV
      total_length: 116
      strategy: |
        CDR3 (16 residues) designed with aromatic F/Y/W positioned to engage
        NK2R toggle switch (CWxP) via ECL2 access channel. Contains Met (M)
        and Thr (T) to mimic NKA C-terminal engagement of the orthosteric
        pocket floor. Compact design optimized for high iPTM confidence.
      predicted_epitope: "ECL2 → orthosteric access channel"
      agonist_rationale: "Direct toggle switch activation via CDR3 aromatic engagement of CWxP/Y266"

    - id: SyF-NK2R-A5
      name: "Max-SASA Broad Epitope"
      cdr1: GFTFSRHAMS
      cdr2: VISWSGESTH
      cdr3: ASQPGYRWDDSSTEYYYDMDV
      total_length: 121
      strategy: |
        Longest CDR3 (21 residues) with extended flat binding surface engaging
        ECL1, ECL2, and ECL3 simultaneously. Dense charged/polar rim
        (D, E, R, S, T) with aromatic core (Y, W). Designed specifically to
        maximize total buried surface area (deltaSASA). The broad footprint
        constrains multiple ECLs, potentially forcing active conformation.
      predicted_epitope: "ECL1 + ECL2 + ECL3 (pan-extracellular)"
      agonist_rationale: "Simultaneous ECL constraint may force TM rearrangement; maximum interface"

