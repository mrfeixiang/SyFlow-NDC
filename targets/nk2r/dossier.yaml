    ecl1: "~Residues 100-108, short loop between TM2-TM3"
    ecl2: "~Residues 171-196, largest ECL, beta-hairpin motif, K180 salt bridge, C106-C181 disulfide"
    ecl3: "~Residues 276-286, contains C281, moderate accessibility"

