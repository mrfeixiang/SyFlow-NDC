        g_protein: "miniGs/q70"
    alphafold_model: "AF-P21452 (UniProt AlphaFold DB)"
    key_residues:
      toggle_switch: "CWxP motif in TM6: NK2R-Y266 (adjacent to W in CWxP)"
      orthosteric_pocket: "C-terminal -GLM of NKA engages deep in TM bundle"
      ecl2_disulfide: "C106(TM3)-C181(ECL2) conserved class A GPCR disulfide"
      ecl2_specificity: "K180 forms salt bridge with NKA-D4 — critical selectivity determinant"
      nterm_contact: "A25 mainchain nitrogen H-bonds NKA-D4"
      activation_hub: "S297-equivalent in NK2R (homologous to NK1R-S297)"
      selectivity_determinants: "NK2R-Y266 vs NK1R-F264 — distinct microenvironments"
      potential_nterm_disulfide: "C4(N-term)-C281(ECL3) — may constrain N-terminus near ECL3"

  extracellular_topology:
