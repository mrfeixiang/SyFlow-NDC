      - id: "7XWO"
        ligand: "Neurokinin A (NKA)"
        g_protein: "Gq (G324 chimera)"
        resolution: "2.7 A"
        note: "First NK2R cryo-EM structure; NKA-bound active state (Sun et al. 2022, Cell Discovery)"
