name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and linter
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src scripts tests

      - name: Import and CLI smoke check
        run: python scripts/smoke_check.py

      - name: Installed console script
        run: syflow --help

      - name: Scientific policy and provenance regression tests
        run: python -m unittest discover -s tests -v

      - name: Wheel install outside checkout
        run: python scripts/check_wheel.py
